name: Nix check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Flake metadata
        run: nix flake metadata --no-update-lock-file

      - name: Format
        shell: bash
        run: |
          mapfile -t nix_files < <(
            git ls-files '*.nix'
          )
          test "${#nix_files[@]}" -gt 0
          nix fmt --no-update-lock-file -- --check "${nix_files[@]}"

      - name: Build complete krisNOS system
        run: nix build --no-update-lock-file --no-link --print-build-logs .#checks.x86_64-linux.krisos-system
