name: Icicle check

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - packages/icicle-patched/**
      - installer/icicle/**
      - profiles/live.nix
      - profiles/icicle-installer.nix
      - .github/workflows/icicle.yml
  pull_request:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - packages/icicle-patched/**
      - installer/icicle/**
      - profiles/live.nix
      - profiles/icicle-installer.nix
      - .github/workflows/icicle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icicle-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build patched Icicle
        run: nix build --no-update-lock-file --no-link .#icicle-patched

      - name: Evaluate installer image
        run: nix eval --no-update-lock-file --raw .#packages.x86_64-linux.iso.drvPath
